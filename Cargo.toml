[package]
name = "smartconnect"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lenovo Smart Connect (Ready For) 100% Pure Rust Native Windows Client"

[dependencies]
smartconnect-fex = { path = "fex" }
nfs3_client = { version = "0.9", default-features = false, features = ["tokio"] }
nfs3_types = "0.5"
ring = "0.17"
x509-parser = "0.16"
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tao = "0.35"
wry = "0.56"
tray-icon = "0.24"
arboard = "3"
rfd = "0.17"
open = "5"
winreg = "0.55"
socket2 = "0.6"
windows = { version = "0.61", features = [
    "ApplicationModel",
    "ApplicationModel_Activation",
    "ApplicationModel_DataTransfer",
    "ApplicationModel_DataTransfer_ShareTarget",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
